<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tucker Ziegler - Play</title>
        <link rel="stylesheet" href="/styles.css">
        <link rel="preload" href="/Fonts/DIN RegularAlternate.woff" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="preload" href="/landing_vectors/play/underlines.svg" as="image" />
        <link rel="preload" href="/landing_vectors/play/work.svg" as="image" />
        <link rel="preload" href="/landing_vectors/play/hard.svg" as="image" />
        <link rel="preload" href="/landing_vectors/play/play.svg" as="image" />
        <link rel="preload" href="/landing_vectors/play/harder.svg" as="image" />

</head>
<!-- HEY! Are you reading my HTML? -->
<body>
    <div id="page-loader" class="loading-overlay" role="status" aria-label="Loading page">
        <dotlottie-wc id="loading-animation" class="loading-animation" autoplay loop></dotlottie-wc>
    </div>
    <div class="site-content">
        <div id="play"></div>
<!-- NAV BAR -->
        <button class="outer-nav-button" onclick="toggleNavbar()">☰</button>
        <div class="navbar">
            <button class="inner-nav-button" onclick="toggleNavbar()">→</button>
            <div class="nav-links">
                <a href="/" class="nav-link">Work</a>
                <a href="#play" class="nav-link nav-link-selected">Play</a>
                <a href="/tools" class="nav-link">Tools</a>
                <a href="mailto:tuckerziegler25@gmail.com" class="nav-link">Contact</a>
            </div>
            <div class="social-links">
                <a href="https://www.instagram.com/tucker.tag/" target="_blank" class="social-link"><i class="fa fa-instagram" style="font-size:30px"></i></a>
                <a href="https://www.linkedin.com/in/tucker-ziegler-b1ba21239/" target="_blank" class="social-link"><i class="fa fa-linkedin" style="font-size:30px"></i></a>
                <a href="https://github.com/Tuckertag" target="_blank" class="social-link"><i class="fa fa-github" style="font-size:30px"></i></a>
            </div>
        </div>
<!-- END NAV BAR -->
<!-- LANDING PAGE  -->
        <div class="landing-scale-wrapper">
        <div class="landing-content">
            <div class="intro-animation untouchable">
                <dotlottie-wc 
                    id="landing-animation"
                    src = ""
                    >
                    </dotlottie-wc>
                    <div class="landing-vectors">
                    <div class="vector-layer"><img src="/landing_vectors/play/underlines.svg"></div>
                    <div class="vector-layer"><img src="/landing_vectors/play/work.svg" class="repulsor"></div>
                    <div class="vector-layer"><img src="/landing_vectors/play/hard.svg" class="repulsor"></div>
                    <div class="vector-layer play-mask"><img src="/landing_vectors/play/play.svg" class="repulsor"></div>
                    <div class="vector-layer"><img src="/landing_vectors/play/harder.svg" class="repulsor"></div>
                </div>
            </div>
            <div class="intro-text untouchable">
                <p class="intro-line">When I'm not making kick-ass motion graphics,</p>
                <p class="intro-line">I'm still making kick-ass motion graphics.</p>
                <p class="intro-line">All work and no play makes a dull boy?</p>
                <p class ="intro-line">Well, uhhhhh...</p>
            </div>
            <div class="thumbnail-grid">
                <div class="thumbnail-wrapper">
                    <div class="thumbnail-card">
                        <img class="thumbnail-image" src="/Images/Project Thumbnails/01_Speed_Racer_Title.png">
                        <p class="thumbnail-text">SPEED RACER</p>
                    </div>
                </div>
                <div class="thumbnail-wrapper">
                    <div class="thumbnail-card">
                        <img class="thumbnail-image" src="/Images/Project Thumbnails/One Piece Titles_Master.png">
                        <p class="thumbnail-text">ONE PIECE</p>
                    </div>
                </div>
            </div>
            <div class="footer">
                    <a href="/" class="footer-link-selected footer-links">Work</a>
                    <a href="#play" class="footer-links">Play</a>
                    <a href="/tools" class="footer-links">Tools</a>
                    <a href="mailto:tuckerziegler25@gmail.com" class="footer-links">Contact</a>
            </div>
        </div>
        </div>
<!-- END LANDING PAGE -->
<!-- PROJECT WINDOWS -->
        <div class="project-wrapper closed-project">
            <div class="project-blur"></div>
            <div class="project-divider"></div>
            <button class="close-button" onclick="closeProject()">✕</button>
            <div class="project-title">
            </div>
            <div class="project-year">
            </div>
            <div class="project-loader loading-overlay" role="status" aria-label="Loading project" hidden>
            </div>
            <div class="project-window">
                
            </div>
        </div>
<!-- END PROJECT WINDOWS -->
    </div>
